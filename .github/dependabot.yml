version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 * * *"
      timezone: Europe/Paris
    # TypeScript 7.0 ne fournit pas encore l'API requise par Vue et typescript-eslint.
    # Retirer cette règle lorsque ces outils annonceront leur compatibilité.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 * * *"
      timezone: Europe/Paris
