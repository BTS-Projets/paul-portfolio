name: Vérifier les pull requests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le formatage et ESLint
        run: npm run lint

      - name: Vérifier Svelte et TypeScript
        run: npm run check

      - name: Construire le site
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Exécuter les tests de parcours
        run: npm run test:e2e
