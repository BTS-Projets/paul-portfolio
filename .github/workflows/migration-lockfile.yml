name: Régénérer le lockfile pour la migration SvelteKit 3

on:
  push:
    branches:
      - migration/sveltekit-3-adapter-static-4

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Résoudre les dépendances compatibles
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Enregistrer le lockfile régénéré
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: regenerate lockfile for SvelteKit 3 migration'
            git push origin HEAD:refs/heads/migration/sveltekit-3-adapter-static-4
          fi
      - name: Installation reproductible
        run: npm ci
      - name: Lint et formatage
        run: npm run lint
      - name: Contrôle Svelte et TypeScript
        run: npm run check
      - name: Build statique
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester les parcours critiques
        run: npm run test:e2e
